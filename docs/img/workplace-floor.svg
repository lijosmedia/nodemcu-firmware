  <path d="M402 530 V885" stroke="#f59e0b" stroke-width="8" stroke-dasharray="26 14"/>
  <path d="M792 530 V885" stroke="#f59e0b" stroke-width="8" stroke-dasharray="26 14"/>
  <path d="M1192 530 V885" stroke="#f59e0b" stroke-width="8" stroke-dasharray="26 14"/>

  <rect x="676" y="810" width="250" height="60" rx="10" fill="#0f172a" opacity="0.72"/>
  <text x="698" y="848" font-family="Segoe UI, Arial" font-size="32" fill="#f8fafc" font-weight="600">Walkway / Safe Path</text>
