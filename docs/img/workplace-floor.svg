<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-label="Workplace floor illustration">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e5e7eb"/>
      <stop offset="1" stop-color="#cbd5e1"/>
    </linearGradient>
    <pattern id="tile" width="40" height="40" patternUnits="userSpaceOnUse">
      <rect width="40" height="40" fill="none" stroke="#b6c2d1" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1280" height="720" fill="url(#bg)"/>
  <rect x="0" y="0" width="1280" height="720" fill="url(#tile)" opacity="0.6"/>

  <rect x="30" y="30" width="1220" height="90" rx="12" fill="#334155"/>
  <text x="70" y="85" font-size="36" font-family="Arial, sans-serif" fill="#f8fafc">AWMS Workplace Floor</text>

  <rect x="45" y="145" width="260" height="160" rx="8" fill="#475569"/>
  <rect x="75" y="175" width="200" height="30" rx="4" fill="#64748b"/>
  <rect x="75" y="220" width="200" height="30" rx="4" fill="#64748b"/>
  <text x="85" y="280" font-size="24" font-family="Arial" fill="#e2e8f0">Storage Rack</text>

  <rect x="360" y="145" width="320" height="210" rx="8" fill="#52525b"/>
  <rect x="390" y="180" width="120" height="140" fill="#71717a"/>
  <rect x="530" y="180" width="120" height="140" fill="#71717a"/>
  <text x="405" y="340" font-size="26" font-family="Arial" fill="#f4f4f5">Machine Zone</text>

  <rect x="730" y="145" width="220" height="140" rx="8" fill="#64748b"/>
  <rect x="755" y="180" width="170" height="24" fill="#94a3b8"/>
  <rect x="755" y="215" width="170" height="24" fill="#94a3b8"/>
  <text x="752" y="270" font-size="23" font-family="Arial" fill="#f1f5f9">Work Bench</text>

  <rect x="980" y="145" width="250" height="170" rx="8" fill="#0f766e"/>
  <rect x="1010" y="180" width="185" height="95" rx="6" fill="#14b8a6"/>
  <text x="1008" y="295" font-size="22" font-family="Arial" fill="#ecfeff">Quality Check</text>

  <rect x="45" y="360" width="1185" height="300" rx="10" fill="#f8fafc" opacity="0.75"/>
  <rect x="70" y="390" width="230" height="220" rx="10" fill="#64748b"/>
  <text x="95" y="510" font-size="26" font-family="Arial" fill="#f8fafc">Tool Area</text>

  <rect x="340" y="390" width="270" height="220" rx="10" fill="#6b7280"/>
  <text x="385" y="510" font-size="26" font-family="Arial" fill="#f8fafc">Cleaning Bay</text>

  <rect x="650" y="390" width="270" height="220" rx="10" fill="#7c3aed" opacity="0.75"/>
  <text x="685" y="510" font-size="26" font-family="Arial" fill="#faf5ff">SOP Board</text>

  <rect x="960" y="390" width="250" height="220" rx="10" fill="#059669" opacity="0.78"/>
  <text x="1000" y="510" font-size="26" font-family="Arial" fill="#ecfdf5">Habit Zone</text>

  <path d="M0 335 H1280" stroke="#f59e0b" stroke-width="8" stroke-dasharray="20 16"/>
  <path d="M320 360 V690" stroke="#f59e0b" stroke-width="8" stroke-dasharray="20 16"/>
  <path d="M630 360 V690" stroke="#f59e0b" stroke-width="8" stroke-dasharray="20 16"/>
  <path d="M940 360 V690" stroke="#f59e0b" stroke-width="8" stroke-dasharray="20 16"/>
</svg>
