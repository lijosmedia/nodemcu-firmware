  <rect x="20" y="145" width="300" height="300" rx="16" fill="#334155" filter="url(#shadow)"/>
  <text x="45" y="185" font-family="Segoe UI, Arial" font-size="28" fill="#e2e8f0" font-weight="700">Storage Rack Area</text>
