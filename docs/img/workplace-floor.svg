<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-label="Realistic workplace scene for AWMS 5S game">
  <defs>
    <linearGradient id="wallGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="floorGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cbd5e1"/>
      <stop offset="1" stop-color="#94a3b8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.35"/>
    </filter>
    <pattern id="floorTile" width="48" height="48" patternUnits="userSpaceOnUse">
      <rect width="48" height="48" fill="none" stroke="#9aa8bc" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1600" height="500" fill="url(#wallGrad)"/>
  <rect y="500" width="1600" height="400" fill="url(#floorGrad)"/>
  <rect y="500" width="1600" height="400" fill="url(#floorTile)" opacity="0.7"/>

  <rect x="0" y="0" width="1600" height="120" fill="#1e293b"/>
